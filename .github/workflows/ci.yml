name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Runs every Criterion benchmark once, as a smoke test.
      - run: cargo test --workspace --benches --locked
      # Native Windows locality probe (spec 8.5): prints the raw Q1-Q4
      # answers for the local temp directory, a loopback UNC path, a `subst`
      # drive and a mapped SMB drive. Every non-local answer must refuse.
      - name: Windows locality probe
        if: runner.os == 'Windows'
        run: cargo test -p pvault-core --lib --locked windows_native_locality_probe -- --include-ignored --nocapture --test-threads=1

  # Minimum supported Rust version (spec Section 12, SI-05). Must pass on all
  # three operating systems before a milestone is accepted.
  msrv:
    name: Rust 1.89 build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # F85: a release build that requests the test-only `fault-injection`
  # feature is refused, and no failpoint name reaches a release artifact.
  release-checks:
    name: release build checks (F85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Release build with fault-injection is refused
        run: |
          if cargo build --release --locked -p pvault-core --features fault-injection; then
            echo "release build with fault-injection succeeded" >&2
            exit 1
          fi
      - name: No failpoint names in release artifacts
        run: |
          cargo build --release --locked --workspace
          names=$(grep -rhoE --exclude=failpoints.rs 'failpoint!\("[^"]+"|fail_io!\("[^"]+"' crates/pvault-core/src | sed -E 's/.*\("//; s/"$//' | sort -u)
          test -n "$names"
          for f in target/release/pvault target/release/libpvault_core.rlib; do
            for n in PVAULT_FAILPOINT $names; do
              if grep -aqF "$n" "$f"; then
                echo "$n found in $f" >&2
                exit 1
              fi
            done
          done

  # The frozen Unicode 17.0.0 tables (spec 7.3, D2) regenerate byte for byte
  # from the pinned UCD archive.
  unicode-tables:
    name: Unicode table regeneration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate and compare
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://www.unicode.org/Public/17.0.0/ucd/UCD.zip -o "$RUNNER_TEMP/UCD.zip"
          python3 tools/unicode/gen_ucd17.py --ucd-zip "$RUNNER_TEMP/UCD.zip" --out-root .
          git diff --exit-code

  # Fuzz smoke test (spec 12): every target for 60 s from generated seeds,
  # with a pinned nightly and cargo-fuzz. Deep fuzzing is Milestone 7.
  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly-2026-10-01
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seeds
        run: PVAULT_FUZZ_SEEDS="$PWD/fuzz/corpus" cargo test -p pvault-core --lib --locked fuzz_seeds -- --ignored
      - name: Fuzz each target
        run: |
          for t in header_parse journal_parse keytable_parse stream_parse; do
            cargo +"$NIGHTLY" fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done

  # Advisories, bans, sources and dependency licenses (deny.toml), over the
  # full graph: production, test, benchmark and build dependencies, all
  # targets. Uses the official cargo-deny 0.20.2 release binary, verified
  # against a pinned SHA-256, which is the same version used locally.
  cargo-deny:
    name: cargo-deny 0.20.2
    runs-on: ubuntu-latest
    env:
      DENY_VERSION: "0.20.2"
      DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.89"
      - name: Install cargo-deny (pinned release, checksum verified)
        run: |
          archive="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${archive}" \
            -o "${archive}"
          echo "${DENY_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" --strip-components=1 -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/cargo-deny" --version
      - name: cargo deny check
        run: |
          "${RUNNER_TEMP}/cargo-deny" --locked check --show-stats
          "${RUNNER_TEMP}/cargo-deny" \
            --manifest-path fuzz/Cargo.toml \
            --config fuzz/deny.toml \
            --locked check --show-stats

  # TPM emulator for bound-mode development (spec Section 9.1). Until
  # Milestone 5 this only proves the emulator starts and answers commands.
  swtpm:
    name: swtpm smoke test
    runs-on: ubuntu-latest
    env:
      TPM2TOOLS_TCTI: swtpm:host=127.0.0.1,port=2321
    steps:
      - name: Install swtpm and TSS libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
          swtpm --version
      - name: Start swtpm
        run: |
          mkdir -p "$RUNNER_TEMP/swtpm"
          swtpm socket --tpm2 \
            --tpmstate dir="$RUNNER_TEMP/swtpm" \
            --server type=tcp,port=2321 \
            --ctrl type=tcp,port=2322 \
            --flags not-need-init,startup-clear \
            --log file="$RUNNER_TEMP/swtpm.log" \
            --daemon
      - name: Query the emulated TPM
        run: |
          for attempt in 1 2 3 4 5; do
            if tpm2_getrandom --hex 16; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/swtpm.log"
          exit 1
