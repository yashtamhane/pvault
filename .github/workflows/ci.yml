name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Runs every Criterion benchmark once, as a smoke test.
      - run: cargo test --workspace --benches --locked
      # Native Windows locality probe (spec 8.5): prints the raw Q1-Q4
      # answers for the local temp directory, a loopback UNC path, a `subst`
      # drive and a mapped SMB drive. Every non-local answer must refuse.
      - name: Windows locality probe
        if: runner.os == 'Windows'
        run: cargo test -p pvault-core --lib --locked windows_native_locality_probe -- --include-ignored --nocapture --test-threads=1
      # Real FAT, exFAT and (Linux) FUSE `fuseblk` file systems on disposable
      # images (Milestone 4, docs/M4_READINESS.md 6.3 and 17): vault refusal
      # (F74) and the O3 refusal of export and card destinations. A mocked
      # type does not replace these.
      - name: Mount disposable FAT and exFAT images (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools exfatprogs exfat-fuse
          # The in-kernel exFAT driver is in linux-modules-extra on the
          # runner's kernel; without it the step fails (no silent skip).
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          sudo modprobe exfat
          truncate -s 64M "$RUNNER_TEMP/fat.img" "$RUNNER_TEMP/exfat.img" "$RUNNER_TEMP/fuse.img"
          mkfs.vfat -F 32 -n PVFAT "$RUNNER_TEMP/fat.img"
          mkfs.exfat -L PVEXFAT "$RUNNER_TEMP/exfat.img"
          mkfs.exfat -L PVFUSE "$RUNNER_TEMP/fuse.img"
          sudo mkdir -p /mnt/pvfat /mnt/pvexfat /mnt/pvfuse
          ids="uid=$(id -u),gid=$(id -g),umask=077"
          sudo mount -t vfat -o "loop,$ids" "$RUNNER_TEMP/fat.img" /mnt/pvfat
          sudo mount -t exfat -o "loop,$ids" "$RUNNER_TEMP/exfat.img" /mnt/pvexfat
          # exFAT through FUSE on a block device reports `fuseblk` (O3).
          dev=$(sudo losetup -f --show "$RUNNER_TEMP/fuse.img")
          echo "PVFUSE_DEV=$dev" >> "$GITHUB_ENV"
          sudo mount.exfat-fuse -o "$ids" "$dev" /mnt/pvfuse
          for m in /mnt/pvfat /mnt/pvexfat /mnt/pvfuse; do findmnt --mountpoint "$m"; done
          test "$(findmnt -no FSTYPE --mountpoint /mnt/pvfuse)" = fuseblk
          echo "PVAULT_TEST_FAT_DIR=/mnt/pvfat" >> "$GITHUB_ENV"
          echo "PVAULT_TEST_EXFAT_DIR=/mnt/pvexfat" >> "$GITHUB_ENV"
          echo "PVAULT_TEST_FUSEBLK_DIR=/mnt/pvfuse" >> "$GITHUB_ENV"
      - name: Mount disposable FAT and exFAT images (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/pvfat" "$RUNNER_TEMP/pvexfat"
          hdiutil create -quiet -size 64m -fs "MS-DOS FAT32" -volname PVFAT -layout NONE "$RUNNER_TEMP/fat.dmg"
          hdiutil create -quiet -size 64m -fs ExFAT -volname PVEXFAT -layout NONE "$RUNNER_TEMP/exfat.dmg"
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/pvfat" "$RUNNER_TEMP/fat.dmg"
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/pvexfat" "$RUNNER_TEMP/exfat.dmg"
          # G1: APFS with ownership ignored (refused) and enforced (control).
          mkdir -p "$RUNNER_TEMP/pvnoowners" "$RUNNER_TEMP/pvowners"
          hdiutil create -quiet -size 64m -fs APFS -volname PVNOOWN "$RUNNER_TEMP/noowners.dmg"
          hdiutil create -quiet -size 64m -fs APFS -volname PVOWN "$RUNNER_TEMP/owners.dmg"
          hdiutil attach -quiet -nobrowse -owners off -mountpoint "$RUNNER_TEMP/pvnoowners" "$RUNNER_TEMP/noowners.dmg"
          hdiutil attach -quiet -nobrowse -owners on -mountpoint "$RUNNER_TEMP/pvowners" "$RUNNER_TEMP/owners.dmg"
          mount | grep -E "pvfat|pvexfat|pvnoowners|pvowners"
          mount | grep pvnoowners | grep -q noowners
          if mount | grep pvowners | grep -q noowners; then
            echo "the control image is mounted with ownership ignored" >&2
            exit 1
          fi
          echo "PVAULT_TEST_FAT_DIR=$RUNNER_TEMP/pvfat" >> "$GITHUB_ENV"
          echo "PVAULT_TEST_EXFAT_DIR=$RUNNER_TEMP/pvexfat" >> "$GITHUB_ENV"
          echo "PVAULT_TEST_NOOWNERS_DIR=$RUNNER_TEMP/pvnoowners" >> "$GITHUB_ENV"
          echo "PVAULT_TEST_OWNERS_DIR=$RUNNER_TEMP/pvowners" >> "$GITHUB_ENV"
      - name: Mount disposable FAT and exFAT VHDs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $volumes = @(
            @{ Name = 'fat'; Fs = 'fat32'; Letter = 'P' },
            @{ Name = 'exfat'; Fs = 'exfat'; Letter = 'Q' }
          )
          foreach ($v in $volumes) {
            $vhd = Join-Path $env:RUNNER_TEMP "$($v.Name).vhdx"
            $script = Join-Path $env:RUNNER_TEMP "$($v.Name).diskpart"
            @(
              "create vdisk file=`"$vhd`" maximum=128 type=expandable",
              "select vdisk file=`"$vhd`"",
              "attach vdisk",
              "convert mbr",
              "create partition primary",
              "format fs=$($v.Fs) quick label=PV$($v.Name.ToUpper())",
              "assign letter=$($v.Letter)"
            ) | Set-Content -Encoding ascii $script
            diskpart /s $script
            if ($LASTEXITCODE -ne 0) { throw "diskpart failed for $($v.Name)" }
            New-Item -ItemType Directory -Path "$($v.Letter):\pv" | Out-Null
          }
          Get-Volume -DriveLetter P, Q | Format-Table -AutoSize
          "PVAULT_TEST_FAT_DIR=P:\pv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PVAULT_TEST_EXFAT_DIR=Q:\pv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: FAT and exFAT image scenarios
        env:
          PVAULT_TEST_REQUIRE_IMAGES: "1"
        run: cargo test -p pvault-tests --locked --test failure_scenarios -- fat_exfat ownership_ignored
      # Native (non-Unicode) file names, docs/M4_READINESS.md 17: on Linux
      # (byte 0xFF) and Windows (unpaired surrogate) these cases must run; a
      # skip, or a filter that matches no test, fails the step. macOS APFS
      # rejects invalid UTF-8 names itself (documented limit), so the step
      # does not run there.
      - name: Native-name coverage (no skips)
        if: runner.os != 'macOS'
        shell: bash
        env:
          PVAULT_TEST_REQUIRE_NATIVE_NAMES: "1"
        run: |
          set -o pipefail
          cargo test -p pvault-core --lib --locked -- --exact \
            vault::tests::non_unicode_native_names_export_record_and_cleanup 2>&1 | tee native-unit.log
          grep -q "test result: ok. 1 passed; 0 failed" native-unit.log
          cargo test -p pvault-tests --locked --test failure_scenarios -- \
            native_paths_are_rendered_safely 2>&1 | tee native-cli.log
          grep -q "test result: ok. 1 passed; 0 failed; 0 skipped" native-cli.log
      - name: Unmount the images (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          sudo umount /mnt/pvfat /mnt/pvexfat /mnt/pvfuse || true
          if [ -n "${PVFUSE_DEV:-}" ]; then sudo losetup -d "$PVFUSE_DEV" || true; fi
      - name: Detach the images (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          hdiutil detach -quiet "$RUNNER_TEMP/pvfat" || true
          hdiutil detach -quiet "$RUNNER_TEMP/pvexfat" || true
          hdiutil detach -quiet "$RUNNER_TEMP/pvnoowners" || true
          hdiutil detach -quiet "$RUNNER_TEMP/pvowners" || true

  # Minimum supported Rust version (spec Section 12, SI-05). Must pass on all
  # three operating systems before a milestone is accepted.
  msrv:
    name: Rust 1.89 build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # F85: a release build that requests the test-only `fault-injection`
  # feature is refused, and no failpoint name reaches a release artifact.
  release-checks:
    name: release build checks (F85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Release build with fault-injection is refused
        run: |
          if cargo build --release --locked -p pvault-core --features fault-injection; then
            echo "release build with fault-injection succeeded" >&2
            exit 1
          fi
      - name: No failpoint names in release artifacts
        run: |
          cargo build --release --locked --workspace
          names=$(grep -rhoE --exclude=failpoints.rs 'failpoint!\("[^"]+"|fail_io!\("[^"]+"' crates/pvault-core/src | sed -E 's/.*\("//; s/"$//' | sort -u)
          test -n "$names"
          for f in target/release/pvault target/release/libpvault_core.rlib; do
            for n in PVAULT_FAILPOINT $names; do
              if grep -aqF "$n" "$f"; then
                echo "$n found in $f" >&2
                exit 1
              fi
            done
          done

  # The frozen Unicode 17.0.0 tables (spec 7.3, D2) regenerate byte for byte
  # from the pinned UCD archive.
  unicode-tables:
    name: Unicode table regeneration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate and compare
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://www.unicode.org/Public/17.0.0/ucd/UCD.zip -o "$RUNNER_TEMP/UCD.zip"
          python3 tools/unicode/gen_ucd17.py --ucd-zip "$RUNNER_TEMP/UCD.zip" --out-root .
          git diff --exit-code

  # Fuzz smoke test (spec 12): every target for 60 s from generated seeds,
  # with a pinned nightly and cargo-fuzz. Deep fuzzing is Milestone 7.
  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: nightly-2026-10-01
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seeds
        run: PVAULT_FUZZ_SEEDS="$PWD/fuzz/corpus" cargo test -p pvault-core --lib --locked fuzz_seeds -- --ignored
      - name: Fuzz each target
        run: |
          for t in header_parse journal_parse keytable_parse stream_parse card_parse; do
            cargo +"$NIGHTLY" fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done

  # Advisories, bans, sources and dependency licenses (deny.toml), over the
  # full graph: production, test, benchmark and build dependencies, all
  # targets. Uses the official cargo-deny 0.20.2 release binary, verified
  # against a pinned SHA-256, which is the same version used locally.
  cargo-deny:
    name: cargo-deny 0.20.2
    runs-on: ubuntu-latest
    env:
      DENY_VERSION: "0.20.2"
      DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.89"
      - name: Install cargo-deny (pinned release, checksum verified)
        run: |
          archive="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${archive}" \
            -o "${archive}"
          echo "${DENY_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" --strip-components=1 -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/cargo-deny" --version
      - name: cargo deny check
        run: |
          "${RUNNER_TEMP}/cargo-deny" --locked check --show-stats
          "${RUNNER_TEMP}/cargo-deny" \
            --manifest-path fuzz/Cargo.toml \
            --config fuzz/deny.toml \
            --locked check --show-stats

  # TPM emulator for bound-mode development (spec Section 9.1). Until
  # Milestone 5 this only proves the emulator starts and answers commands.
  swtpm:
    name: swtpm smoke test
    runs-on: ubuntu-latest
    env:
      TPM2TOOLS_TCTI: swtpm:host=127.0.0.1,port=2321
    steps:
      - name: Install swtpm and TSS libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools libtss2-dev
          swtpm --version
      - name: Start swtpm
        run: |
          mkdir -p "$RUNNER_TEMP/swtpm"
          swtpm socket --tpm2 \
            --tpmstate dir="$RUNNER_TEMP/swtpm" \
            --server type=tcp,port=2321 \
            --ctrl type=tcp,port=2322 \
            --flags not-need-init,startup-clear \
            --log file="$RUNNER_TEMP/swtpm.log" \
            --daemon
      - name: Query the emulated TPM
        run: |
          for attempt in 1 2 3 4 5; do
            if tpm2_getrandom --hex 16; then
              echo
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/swtpm.log"
          exit 1
