# cargo-deny policy (approved in Milestone 1: advisories, bans, sources,
# dependency licenses). Review every finding; never suppress one silently.

[graph]
all-features = false

[advisories]
# Every advisory in the RustSec database fails the check. Any future
# exception must name the advisory ID and give a written reason.
yanked = "deny"
ignore = []

[licenses]
# pvault is GPL-3.0-only (SI-04). These are the dependency licenses present
# in the graph, all assessed as compatible with GPL-3.0-only. Adding a license
# here is a reviewed decision.
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "Unicode-3.0"]
# pvault's own crates are checked against the project license, which is
# deliberately not part of the dependency allowlist.
exceptions = [
    { allow = ["GPL-3.0-only"], crate = "pvault-core" },
    { allow = ["GPL-3.0-only"], crate = "pvault-cli" },
    { allow = ["GPL-3.0-only"], crate = "pvault-tests" },
    # Milestone 4 (A7, approved 2026-10-05): quirc-derived code in rqrr (ISC).
    { allow = ["ISC"], crate = "rqrr" },
    # Milestone 4 (A7): hasher used by rqrr's LRU cache (Zlib).
    { allow = ["Zlib"], crate = "foldhash" },
    # Milestone 4 (A7): Option helpers used by directories (MPL-2.0; no
    # Exhibit B notice, so the GPL secondary-license clause applies).
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Milestone 5 (D1, approved 2026-10-06): build dependency of tss-esapi-sys
    # (Linux only), not compiled into pvault. The LLVM exception only adds
    # permissions to Apache-2.0.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
]
confidence-threshold = 0.93
# By default the license check skips crates that are reachable only through
# dev- or build-dependencies of workspace crates. Test, benchmark and build
# tooling is checked too. Advisories, bans and sources already use the full
# graph ([graph] exclude-dev defaults to false).
include-dev = true
include-build = true

[licenses.private]
# pvault's own crates are unpublished but licensed, so they are checked too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
