[package]
name = "pvault-cli"
description = "Command-line interface for pvault, an offline encrypted file vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pvault"
path = "src/main.rs"

[features]
# Test-only crash injection, forwarded to pvault-core (F85: refused in
# release builds).
fault-injection = ["pvault-core/fault-injection"]

[dependencies]
pvault-core.workspace = true
clap.workspace = true

[dev-dependencies]
assert_cmd.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
