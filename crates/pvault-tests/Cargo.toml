[package]
name = "pvault-tests"
description = "Cross-crate failure-scenario tests for pvault (spec 11, 12). Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Crash tests abort inside the library at named failpoints (spec 11, SI-48).
# Dev-dependencies only: a release build of the workspace never enables the
# feature (F85).
pvault-core = { workspace = true, features = ["fault-injection"] }
pvault-cli = { path = "../pvault-cli", features = ["fault-injection"] }
tempfile.workspace = true
png.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[[test]]
name = "failure_scenarios"
path = "../../tests/failure_scenarios.rs"
# The test binary doubles as the CLI child (it re-executes itself), so it has
# its own `main`.
harness = false

[lints]
workspace = true
