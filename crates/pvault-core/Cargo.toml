[package]
name = "pvault-core"
description = "Core library for pvault, an offline encrypted file vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["tpm"]
# Test-only crash injection (spec 11, SI-48). Refused in release builds (F85).
fault-injection = []
# Bound mode's TPM access (spec 9.1; D1, D10). The dependency exists only on
# Linux; elsewhere the feature has no effect and bound mode is refused.
tpm = ["dep:tss-esapi"]

[dependencies]
secrecy.workspace = true
zeroize.workspace = true
subtle.workspace = true
thiserror.workspace = true
getrandom.workspace = true
aes-gcm-siv.workspace = true
aes.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
argon2.workspace = true
chacha20.workspace = true
unicode-normalization.workspace = true
vsss-rs.workspace = true
zxcvbn.workspace = true
qrcode.workspace = true
rqrr.workspace = true
png.workspace = true
directories.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "crypto"
harness = false

[lints]
workspace = true
