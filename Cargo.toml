[workspace]
resolver = "3"
members = ["crates/pvault-core", "crates/pvault-cli", "crates/pvault-tests"]
# cargo-fuzz targets build with nightly only (spec 12).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Yash Sandeep Tamhane"]
repository = "https://github.com/yashtamhane/pvault"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
pvault-core = { path = "crates/pvault-core" }

# Approved crates (spec Section 7.6).
secrecy = "0.10"
zeroize = "1.8"
subtle = "2.6"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4.3"
aes-gcm-siv = { version = "0.12.1", default-features = false, features = ["aes", "zeroize"] }
# Direct dependency only to enable `zeroize` on the AES key schedule used by
# aes-gcm-siv (approved in Milestone 1; same version aes-gcm-siv resolves).
aes = { version = "0.9.3", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
sha2 = "0.11.0"
argon2 = { version = "0.6.0", default-features = false, features = ["zeroize"] }
chacha20 = { version = "0.10.2", default-features = false, features = ["xchacha", "zeroize"] }
unicode-normalization = "0.1.25"
# Shamir (SI-08): used only through its public polynomial API with
# pvault-owned, zeroizing storage.
vsss-rs = { version = "=6.0.1", default-features = false }
# Custom-passphrase strength estimate (SI-51): called only inside the
# creation-time estimator child process.
zxcvbn = { version = "=3.1.1", default-features = false }
# Recovery cards (spec 7.4a to 7.4c; approved for Milestone 4, A7).
qrcode = { version = "=0.14.1", default-features = false }
rqrr = { version = "=0.11.0", default-features = false }
png = "=0.18.1"
# Per-user settings folder (7.9, 9.7; approved for Milestone 4, A7).
directories = "=6.0.0"
tempfile = "3.27.0"
assert_cmd = "2"
criterion = "0.8.2"
proptest = "1.11"

# Platform FFI (spec Section 7.6a).
libc = "0.2"
windows-sys = { version = "0.61", features = [
    # Handle-relative file operations (NtCreateFile, NtSetInformationFile;
    # spec 7.6a, 8.1; M3-F2).
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"

# Cryptographic dependencies are far too slow unoptimized for the known-answer
# tests (Argon2id at 256 MiB, 10 MiB streams). This affects dependencies only;
# pvault's own crates keep the normal debug profile.
[profile.dev.package."*"]
opt-level = 3
